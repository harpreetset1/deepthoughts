steps:
  # Install dependencies
  - name: 'node:22-alpine'
    entrypoint: 'npm'
    args: ['ci']

  # Build the React application
  - name: 'node:22-alpine'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Deploy to Firebase Hosting
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm install -g firebase-tools && firebase deploy --only hosting:deepthoughtnetworks --project aibot-fc4fc'

timeout: "600s"
